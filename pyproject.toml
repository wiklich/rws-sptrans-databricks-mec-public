[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rws-sptrans-databricks-mec"
version = "0.1.0"
description = "SPTrans Databricks ETL package"
requires-python = ">=3.10,<3.13"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
