resources:
  jobs:
    sptrans_etl_orchestrator:
      name: sptrans_etl_orchestrator

      tasks:
        - task_key: bronze_planned
          pipeline_task:
            pipeline_id: ${resources.pipelines.etl_pipeline_bronze_planned.id}

        - task_key: bronze_observed
          pipeline_task:
            pipeline_id: ${resources.pipelines.etl_pipeline_bronze_observed.id}

        - task_key: core_silver_and_foundations
          depends_on:
            - task_key: bronze_planned
            - task_key: bronze_observed
          pipeline_task:
            pipeline_id: ${resources.pipelines.etl_pipeline_core_silver_and_foundations.id}

        - task_key: quality_silver_observed
          depends_on:
            - task_key: core_silver_and_foundations
          pipeline_task:
            pipeline_id: ${resources.pipelines.etl_pipeline_quality_silver_observed.id}

        - task_key: quality_silver_planned
          depends_on:
            - task_key: core_silver_and_foundations
          pipeline_task:
            pipeline_id: ${resources.pipelines.etl_pipeline_quality_silver_planned.id}

        - task_key: quality_silver_specialized
          depends_on:
            - task_key: core_silver_and_foundations
          pipeline_task:
            pipeline_id: ${resources.pipelines.etl_pipeline_quality_silver_specialized.id}

        - task_key: gold_observed
          depends_on:
            - task_key: core_silver_and_foundations
          pipeline_task:
            pipeline_id: ${resources.pipelines.etl_pipeline_gold_observed.id}

        - task_key: gold_planned_reference
          depends_on:
            - task_key: core_silver_and_foundations
          pipeline_task:
            pipeline_id: ${resources.pipelines.etl_pipeline_gold_planned_reference.id}

        - task_key: gold_planned_vs_observed
          depends_on:
            - task_key: gold_observed
            - task_key: gold_planned_reference
          pipeline_task:
            pipeline_id: ${resources.pipelines.etl_pipeline_gold_planned_vs_observed.id}

        - task_key: quality_observed
          depends_on:
            - task_key: gold_observed
          pipeline_task:
            pipeline_id: ${resources.pipelines.etl_pipeline_quality_observed.id}

        - task_key: quality_planned_reference
          depends_on:
            - task_key: gold_planned_reference
          pipeline_task:
            pipeline_id: ${resources.pipelines.etl_pipeline_quality_planned_reference.id}

        - task_key: quality_planned_vs_observed
          depends_on:
            - task_key: gold_planned_vs_observed
          pipeline_task:
            pipeline_id: ${resources.pipelines.etl_pipeline_quality_planned_vs_observed.id}
