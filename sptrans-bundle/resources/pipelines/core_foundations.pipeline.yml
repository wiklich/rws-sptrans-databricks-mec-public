resources:
  pipelines:
    etl_pipeline_core_silver_and_foundations:
      name: etl_pipeline_core_silver_and_foundations
      catalog: ${var.catalog}
      schema: ${var.silver_schema}
      development: true
      continuous: false
      channel: CURRENT
      serverless: true

      environment:
        dependencies:
          - ${workspace.artifact_path}/.internal/rws_sptrans_databricks_mec-0.1.0-py3-none-any.whl

      libraries:
        - glob:
            include: ../../../src/pipelines/core_foundations/**

      tags:
        domain: core_foundations
        layer: silver
        source: sptrans_gtfs
        component: etl_pipeline_core_silver_and_foundations
