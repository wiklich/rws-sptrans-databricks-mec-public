resources:
  pipelines:
    etl_pipeline_gold_observed:
      name: etl_pipeline_gold_observed
      catalog: ${var.catalog}
      schema: ${var.gold_schema}
      development: true
      continuous: false
      channel: CURRENT
      serverless: true

      environment:
        dependencies:
          - ${workspace.artifact_path}/.internal/rws_sptrans_databricks_mec-0.1.0-py3-none-any.whl

      libraries:
        - glob:
            include: ../../../src/pipelines/gold_observed/**

      tags:
        domain: observed
        layer: gold
        source: sptrans_position
        component: etl_pipeline_gold_observed
