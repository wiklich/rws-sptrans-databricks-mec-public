resources:
  pipelines:
    etl_pipeline_quality_silver_specialized:
      name: etl_pipeline_quality_silver_specialized
      catalog: ${var.catalog}
      schema: ${var.silver_schema}
      development: true
      continuous: false
      channel: CURRENT
      serverless: true

      environment:
        dependencies:
          - ${workspace.artifact_path}/.internal/rws_sptrans_databricks_mec-0.1.0-py3-none-any.whl

      libraries:
        - glob:
            include: ../../../src/quality/silver/specialized/validations/**
        - glob:
            include: ../../../src/quality/silver/specialized/audits/**

      tags:
        domain: silver_specialized
        layer: quality
        source: specialized
        component: etl_pipeline_quality_silver_specialized
